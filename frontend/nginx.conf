server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No anunciar la version exacta de nginx.
  server_tokens off;

  # Cabeceras de seguridad. La CSP permite solo lo que la app usa de verdad:
  # su propio JS/CSS, las fuentes de Google y las imagenes remotas que pegan
  # los usuarios (fotos de progreso, avatares, miniaturas de ejercicios).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Los assets con hash en el nombre son inmutables: se cachean para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El index nunca se cachea, para que un despliegue nuevo se vea al instante.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
